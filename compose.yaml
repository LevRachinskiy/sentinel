services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://sentinel:local-development-only@postgres/sentinel
      DEMO_MODE: "true"
      SANDBOX_URL: http://sandbox:8001
      SANDBOX_TOKEN: local-sandbox-only
      MODEL_PROVIDER: ${MODEL_PROVIDER:-baseline}
      MODEL_NAME: ${MODEL_NAME:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      sandbox: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  sandbox:
    build: .
    command: ["python", "-m", "uvicorn", "sentinel.sandbox:create_sandbox", "--factory", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      SANDBOX_DB: /data/sandbox.db
      SANDBOX_TOKEN: local-sandbox-only
    ports: ["127.0.0.1:8001:8001"]
    volumes: ["sandbox-data:/data"]
  dashboard:
    build: ./frontend
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres-data:
  sandbox-data:

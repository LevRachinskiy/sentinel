[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ops"
version = "0.1.0"
description = "Evidence-driven incident investigation with approval-gated remediation"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<0.143", "uvicorn>=0.30,<0.55", "sqlalchemy>=2.0,<2.2", "httpx>=0.27,<0.29", "psycopg[binary]>=3.2,<4", "opentelemetry-api>=1.29,<2", "opentelemetry-sdk>=1.29,<2", "opentelemetry-instrumentation-fastapi>=0.50b0,<0.67"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
